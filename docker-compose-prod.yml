services:
  postgres:
    image: postgres:16-alpine
    container_name: elyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elyx}
      POSTGRES_USER: ${POSTGRES_USER:-elyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elyx_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elyx_user} -d ${POSTGRES_DB:-elyx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elyx-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: elyx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # `production` cambia comportamiento real: Turnstile pasa a fail-closed
      # (sin llave rechaza en vez de dejar pasar), `COOKIE_SECURE` se fuerza en
      # las cookies de sesion y se dejan de aceptar origenes localhost en CORS.
      # Si esta instancia es un despliegue real, NO lo bajes a `development`.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://elyx_user:elyx_pass@postgres:5432/elyx}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      JWT_SECRET: ${JWT_SECRET:-Elyx_2026_Strong_JWT_Secret_Change_Me_92f4bca67f7e}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_TOKEN_TTL_SESSION_HOURS: ${REFRESH_TOKEN_TTL_SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CSRF_SECRET: ${CSRF_SECRET:-elyx-dev-csrf-secret}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-elyx-dev-mfa-key}
      CAPTCHA_MATH_ENABLED: ${CAPTCHA_MATH_ENABLED:-true}
      CAPTCHA_MATH_ENFORCE: ${CAPTCHA_MATH_ENFORCE:-after_failures}
      BEHAVIOR_ENFORCE: ${BEHAVIOR_ENFORCE:-soft}
      PUBLIC_FILES_BASE_URL: ${PUBLIC_FILES_BASE_URL:-http://localhost:${BACKEND_PORT:-3000}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      # Registro publico de condominios ("Crea tu condominio").
      REGISTRO_PUBLICO_ENABLED: ${REGISTRO_PUBLICO_ENABLED:-true}
      REGISTRO_EXPIRACION_HORAS: ${REGISTRO_EXPIRACION_HORAS:-24}
      INVITACION_EXPIRACION_DIAS: ${INVITACION_EXPIRACION_DIAS:-30}
      # Suscripcion a Elyx: desactivada por defecto (self-hosting sin cobro).
      SUSCRIPCION_ENABLED: ${SUSCRIPCION_ENABLED:-false}
      SUSCRIPCION_PROVIDER: ${SUSCRIPCION_PROVIDER:-MANUAL}
      SUSCRIPCION_DIAS_PRUEBA: ${SUSCRIPCION_DIAS_PRUEBA:-0}
      SUSCRIPCION_MONTO_BASE: ${SUSCRIPCION_MONTO_BASE:-0}
      SUSCRIPCION_PURGA_DIAS: ${SUSCRIPCION_PURGA_DIAS:-30}
      # Precio: cuota base + costo por unidad, con piso mensual. Todo NETO; el IVA se desglosa.
      SUSCRIPCION_PRECIO_BASE: ${SUSCRIPCION_PRECIO_BASE:-200}
      SUSCRIPCION_PRECIO_UNIDAD: ${SUSCRIPCION_PRECIO_UNIDAD:-7}
      SUSCRIPCION_PRECIO_PISO: ${SUSCRIPCION_PRECIO_PISO:-250}
      SUSCRIPCION_IVA_PORCENTAJE: ${SUSCRIPCION_IVA_PORCENTAJE:-16}
      SUSCRIPCION_DIAS_GRACIA: ${SUSCRIPCION_DIAS_GRACIA:-7}
      # Stripe (solo con SUSCRIPCION_PROVIDER=STRIPE)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Secreto del endpoint de webhooks de Connect (cobro de cuotas). Es distinto
      # del anterior porque Stripe separa los eventos por scope.
      STRIPE_WEBHOOK_SECRET_CONNECT: ${STRIPE_WEBHOOK_SECRET_CONNECT:-}
      STRIPE_PRICE_BASE: ${STRIPE_PRICE_BASE:-}
      STRIPE_PRICE_UNIDAD: ${STRIPE_PRICE_UNIDAD:-}
      STRIPE_TAX_RATE_ID: ${STRIPE_TAX_RATE_ID:-}
      SUSCRIPCION_DATOS_PAGO: ${SUSCRIPCION_DATOS_PAGO:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      # Stripe exige que la URL del negocio sea publica y con https. En
      # produccion debe ser el dominio real del frontend.
      STRIPE_BUSINESS_BASE_URL: ${STRIPE_BUSINESS_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Retencion de datos (docs/politica-privacidad.md). "false" la desactiva.
      RETENCION_ENABLED: ${RETENCION_ENABLED:-true}
      RETENCION_TELEMETRIA_DIAS: ${RETENCION_TELEMETRIA_DIAS:-30}
      RETENCION_AUDITORIA_DIAS: ${RETENCION_AUDITORIA_DIAS:-365}
      RETENCION_TOKENS_DIAS: ${RETENCION_TOKENS_DIAS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # auto (SMTP si esta configurado) | smtp | resend
      MAIL_PROVIDER: ${MAIL_PROVIDER:-auto}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      args:
        # Las variables VITE_* se hornean en el bundle al compilar.
        # Si cambian, hay que reconstruir la imagen (--build).
        VITE_API_URL: ${VITE_API_URL:-https://api.elyx-app.com}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        # Sin esta clave el checkout embebido muestra un aviso en vez del formulario.
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: elyx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sin bind mount y sin Vite: se sirve el dist compilado con nginx.
    # El puerto del host se mantiene en 5173 para no tocar el proxy inverso.
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  redis_data: