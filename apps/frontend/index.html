    <meta name="description" content="Plataforma condominal Elyx. Finanzas condominales claras y sin papeles. Accede para operar pagos, avisos, validaciones y reportes reales." />

    <title>Elyx</title>
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <!-- Iconos: cada href apunta a un archivo que existe en public/ -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a1226" />
    <script>
      (function () {
        var base = "%VITE_API_URL%";
        if (!base || base.indexOf("%") === 0) {
          base = window.location.origin;
        }
        if (base.slice(-4) === "/api") {
          base = base.slice(0, -4);
        }

        var estado = {
          endpoint: base + "/api/behavior",
          inicio: Date.now(),
          eventos: [],
          ultimo: {}
        };
        window.__ELYX_BEHAVIOR__ = estado;

        function registrar(tipo, datos) {
          var ahora = Date.now();
          var evento = { tipo: tipo, t: ahora - estado.inicio };
          var anterior = estado.ultimo[tipo];
          if (anterior) {
            evento.dt = ahora - anterior;
          }
          estado.ultimo[tipo] = ahora;
          if (datos) {
            for (var clave in datos) {
              if (Object.prototype.hasOwnProperty.call(datos, clave)) {
                evento[clave] = datos[clave];
              }
            }
          }
          estado.eventos.push(evento);
          if (estado.eventos.length > 200) {
            estado.eventos.shift();
          }
        }

        window.addEventListener("mousemove", function (evento) {
          registrar("mousemove", { x: Math.round(evento.clientX), y: Math.round(evento.clientY) });
        }, { passive: true });
        window.addEventListener("keydown", function () {
          registrar("keydown");
        }, { passive: true });
        window.addEventListener("pointerdown", function () {
          registrar("pointerdown");
        }, { passive: true });
        window.addEventListener("scroll", function () {
          registrar("scroll");
        }, { passive: true });
        document.addEventListener("visibilitychange", function () {
          registrar("visibilitychange");
        }, { passive: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
