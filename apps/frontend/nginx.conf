# ============================================================================
# Elyx frontend - nginx para servir la SPA compilada
#
# Nota sobre `add_header`: nginx NO hereda las cabeceras del bloque `server`
# dentro de un `location` que declare su propio `add_header`. Por eso las
# cabeceras de seguridad viven solo en el nivel `server` y los locations usan
# unicamente `expires`, que no rompe la herencia.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de nginx
    server_tokens off;

    # ---------------------------------------------------------------------
    # Compresion
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Cabeceras de seguridad (heredadas por todos los locations)
    # Las cookies HttpOnly/CSRF las emite el API, no este servidor.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------------------------------------------------------------------
    # Assets con hash en el nombre (index-XXXX.js): cache de un anio
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Manifest e iconos: cache corta
    # ---------------------------------------------------------------------
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        expires 1d;
        try_files $uri =404;
    }

    location ~* ^/(favicon\.ico|favicon[^/]*\.(png|svg)|apple-touch-icon\.png|web-app-manifest-[^/]*\.png|og-image\.png)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # SPA: las rutas de React Router (/inicio, /pagos, ...) no existen como
    # archivo; se devuelve index.html y el router resuelve en el cliente.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # index.html: siempre revalidar, para que un despliegue nuevo se vea sin
    # que el navegador sirva el bundle anterior.
    # ---------------------------------------------------------------------
    location = /index.html {
        expires -1;
    }

    # ---------------------------------------------------------------------
    # Nunca servir archivos de configuracion ni dotfiles (excepto .well-known,
    # que se usa para validaciones de dominio y certificados).
    # ---------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        return 404;
    }
}
